name: rviz2_monitor
description: "RViz2 control & logs HMI — direct docker CLI control + agl-shell gRPC screen switching."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  # gRPC for agl-shell screen switching (ActivateApp @ 127.0.0.1:14005).
  grpc: ^4.0.1
  protobuf: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - config/config.json
