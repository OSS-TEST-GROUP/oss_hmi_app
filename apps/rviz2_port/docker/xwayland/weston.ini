[core]
# Headless backend for containerized environment
backend=headless-backend.so
# Enable XWayland support (X11 apps on Wayland)
xwayland=true

[shell]
# Panel position
panel-position=none
# No background image
background-color=0xff002244

[output]
name=headless
# Virtual display size
mode=1920x1080

[xwayland]
# XWayland display number
path=/usr/bin/Xwayland
