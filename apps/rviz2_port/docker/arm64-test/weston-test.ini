[core]
backend=headless-backend.so
shell=desktop-shell.so
require-input=false

[shell]
locking=false
cursor-theme=default
cursor-size=24

[output]
name=HEADLESS1
mode=1920x1080

[keyboard]
keymap_layout=us

[rdp]
# RDP backend configuration (if WESTON_BACKEND=rdp)
port=3389
tls-cert=/tmp/server.crt
tls-key=/tmp/server.key
