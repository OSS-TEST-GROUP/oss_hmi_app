# meta-rviz2-agl layer configuration
# Custom Yocto layer for RViz2 Wayland porting on AGL Trout 20.0.3 (Scarthgap 5.0)

# Layer identification
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rviz2-agl"
BBFILE_PATTERN_meta-rviz2-agl = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rviz2-agl = "10"

# Layer dependencies
# Requires meta-ros2-humble for ROS2 Humble recipes
# Requires meta-qt5 for Qt5 Wayland backend
# Note: LAYERDEPENDS uses BBFILE_COLLECTIONS names, not directory names
LAYERDEPENDS_meta-rviz2-agl = "core openembedded-layer meta-python ros-common-layer ros2-layer ros2-humble-layer"

# Compatible with Scarthgap (AGL Trout 20.0.3)
LAYERSERIES_COMPAT_meta-rviz2-agl = "scarthgap"

# Layer version
LAYERVERSION_meta-rviz2-agl = "1"

# ===================================================================
# R010 Session 2b: DISTRO_FEATURES Override for X11 Build-Time Support
# ===================================================================
# Issue 3 Fix: AGL distro removes x11 globally, but RViz2 build-time dependencies
# (rviz-ogre-vendor → libx11/libxrandr/libxaw) require it.
#
# Solution: Re-add x11 to DISTRO_FEATURES at layer priority level.
# This is safe because:
#   1. IMAGE_INSTALL does not include X server packages (runtime Wayland-only)
#   2. R007 guards force QT_QPA_PLATFORM=wayland (no X11 runtime usage)
#   3. Build-time X11 libraries are needed only for compilation
#
# Note: This override is specific to RViz2 build requirements and does NOT
# compromise the Wayland-only runtime target.
DISTRO_FEATURES:append = " x11"
