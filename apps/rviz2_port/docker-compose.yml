# RViz2 AGL Docker Compose Integration
# R013: Build/Runtime/Test profile orchestration
# Pattern: oss_hmi_app docker-compose.yml (profiles, NVIDIA GPU, Wayland socket)

version: '3.8'

services:
  # ======================================================================
  # BUILD PROFILE: Source compilation (x86_64 and arm64)
  # ======================================================================

  # Service 1: x86_64 RViz2 source builder (R016 deferred)
  # Purpose: Build RViz2 from source against OGRE 14.x on x86_64
  rviz-source-builder:
    profiles: ["build"]
    image: rviz_agl:source-builder
    build:
      context: ./docker/rviz-source
      dockerfile: Dockerfile
    volumes:
      - ./workspace:/workspace
      - rviz-build-cache:/root/.cache
    environment:
      - COLCON_HOME=/root/.cache/colcon
    command: |
      bash -c "
        echo '[R016] RViz2 x86_64 source build (DEFERRED)'
        echo '[R016] This service will build RViz2 against OGRE 14.x from source'
        echo '[R016] Current status: Placeholder (R016 not yet implemented)'
        exit 0
      "
    networks:
      - rviz-build

  # Service 2: arm64 RViz2 cross-compile builder (R010 deferred)
  # Purpose: Yocto bitbake cross-compile for AGL Trout 20.0.3
  rviz-arm64-builder:
    profiles: ["build"]
    image: rviz_agl:arm64-builder
    build:
      context: .
      dockerfile: docker/Dockerfile.build.arm64
    platform: linux/amd64  # Builder runs on x86_64 host
    volumes:
      - ./yocto:/workdir
      - rviz-downloads:/workdir/downloads
      - rviz-sstate:/workdir/sstate-cache
    environment:
      - BB_ENV_PASSTHROUGH_ADDITIONS=SSTATE_DIR DL_DIR
    command: |
      bash -c "
        echo '[R010] RViz2 arm64 cross-compile (DEFERRED to external CI)'
        echo '[R010] This service will run: bitbake rviz2'
        echo '[R010] Current status: Infrastructure template only'
        echo '[R010] External CI build started: 2026-05-12 02:20 UTC'
        exit 0
      "
    networks:
      - rviz-build

  # ======================================================================
  # RUNTIME PROFILE: x86_64 and arm64 native execution
  # ======================================================================

  # Service 3: x86_64 RViz2 Wayland-only runtime (R009)
  # Purpose: Native Wayland execution on x86_64 (no XWayland)
  rviz-wayland-only:
    profiles: ["runtime"]
    image: rviz_agl:wayland-only
    build:
      context: ./docker/wayland-only
      dockerfile: Dockerfile
    cap_add:
      - SYS_ADMIN  # Required for Weston compositor
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro  # X11 socket (for debugging only)
      - type: bind
        source: /dev/dri
        target: /dev/dri  # GPU device (optional, for hardware acceleration)
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
      - QT_QPA_PLATFORM=wayland
      - QT_WAYLAND_SHELL_INTEGRATION=xdg-shell
      - LIBGL_ALWAYS_SOFTWARE=1  # Software rendering (remove for GPU)
      - BACKEND=${WESTON_BACKEND:-rdp}  # rdp or headless
    ports:
      - "${RDP_PORT:-3389}:3389"  # RDP port for visual verification
    networks:
      - rviz-runtime
    # NVIDIA GPU support (optional, comment out if no NVIDIA GPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Service 4: arm64 RViz2 AGL runtime (R011)
  # Purpose: Native arm64 execution on AGL Trout 20.0.3 or ARM64 host
  rviz-arm64-runtime:
    profiles: ["runtime"]
    image: rviz_agl:arm64-runtime
    build:
      context: ./docker/arm64-runtime
      dockerfile: Dockerfile.arm64
    platform: linux/arm64
    cap_add:
      - SYS_ADMIN  # Required for Weston compositor (if running on AGL)
    volumes:
      - type: bind
        source: ${WAYLAND_SOCKET_DIR:-/run/user/1000}
        target: /run/user/1000  # AGL Wayland socket mount
      - type: bind
        source: /dev/dri
        target: /dev/dri  # GPU device (Mali/PowerVR on AGL)
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/1000
      - QT_QPA_PLATFORM=wayland
      - QT_WAYLAND_SHELL_INTEGRATION=xdg-shell
      - APP_ID=org.agl.rviz2
    network_mode: host  # Use host network for AGL Wayland socket access
    devices:
      - /dev/dri:/dev/dri  # GPU device passthrough

  # ======================================================================
  # TEST PROFILE: Automated testing (QEMU emulation + headless Weston)
  # ======================================================================

  # Service 5: arm64 QEMU test environment (R012)
  # Purpose: x86_64 host testing of arm64 binaries via QEMU user emulation
  rviz-arm64-test:
    profiles: ["test"]
    image: rviz_agl:arm64-test
    build:
      context: ./docker/arm64-test
      dockerfile: Dockerfile.arm64.test
    platform: linux/arm64  # QEMU binfmt_misc will handle emulation
    cap_add:
      - SYS_ADMIN  # Required for Weston compositor
    environment:
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
      - QT_QPA_PLATFORM=wayland
      - QT_WAYLAND_SHELL_INTEGRATION=xdg-shell
      - WESTON_BACKEND=${WESTON_TEST_BACKEND:-headless}
      - VNC_PORT=${VNC_PORT:-5900}
    ports:
      - "${VNC_PORT:-5900}:5900"  # VNC port for visual verification
      - "${RDP_TEST_PORT:-3390}:3389"  # RDP port (avoid conflict with rviz-wayland-only)
    networks:
      - rviz-test

# ======================================================================
# NETWORKS
# ======================================================================
networks:
  rviz-build:
    driver: bridge
  rviz-runtime:
    driver: bridge
  rviz-test:
    driver: bridge

# ======================================================================
# VOLUMES (Persistent build caches)
# ======================================================================
volumes:
  rviz-build-cache:
    driver: local
  rviz-downloads:
    driver: local
  rviz-sstate:
    driver: local
