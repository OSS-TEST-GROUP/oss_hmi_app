services:
  # ─────────────────────────────────────────────
  # Build services (source → binary)
  # ─────────────────────────────────────────────

  # x86_64 Flutter Linux build (GTK bundle)
  # Run: docker compose run --rm adsw_monitor_builder_x86
  adsw_monitor_builder_x86:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build
    image: adsw_monitor_builder:x86_64
    volumes:
      - ../adsw_monitor:/workspace/app
      - ../output:/workspace/output
    profiles: [build]

  # arm64 AOT build (AGL Yocto SDK)
  # Run: docker compose run --rm adsw_monitor_builder_arm64
  adsw_monitor_builder_arm64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build.arm64
      args:
        AGL_SDK_USER: ${AGL_SDK_USER:-ossdev}
        AGL_SDK_PASSWORD: ${AGL_SDK_PASSWORD:-ossdev1234}
    image: adsw_monitor_builder:arm64
    volumes:
      - ../adsw_monitor:/workspace/app
      - ../output:/workspace/output
    profiles: [build]

  # ─────────────────────────────────────────────
  # Runtime services (runtime images)
  # ─────────────────────────────────────────────

  # x86_64 runtime image (GTK-based, for development/testing)
  adsw_monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: adsw_monitor
    image: adsw_monitor:x86_64
    container_name: adsw_monitor

    # Wayland socket mount (AGL/Linux environment)
    volumes:
      - /run/user/1000:/run/user/1000          # Wayland socket
      - /tmp/.X11-unix:/tmp/.X11-unix          # X11 fallback
      - ../adsw_monitor/config/config.json:/app/config/config.json  # rosbridge config override

    environment:
      - DISPLAY=:1
      - XDG_RUNTIME_DIR=/run/user/1000

    # host network for DDS/ROS2 communication
    network_mode: host

    # NVIDIA GPU (required when the X server uses NV-GLX)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

  # arm64 test image (QEMU emulation + headless Weston, for x86_64 hosts)
  # Prereq: adsw_monitor_builder:arm64 image + output/adsw_monitor-arm64-release.tar.gz
  # Build: docker compose build adsw_monitor_arm64_test
  # Run: docker compose run --rm adsw_monitor_arm64_test
  adsw_monitor_arm64_test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64.test
      platforms:
        - linux/arm64
    image: adsw_monitor:arm64-test
    container_name: adsw_monitor_arm64_test

    volumes:
      - ../adsw_monitor/config/config.json:/etc/adsw_monitor/config.json

    environment:
      - APP_NAME=adsw_monitor
      - APP_VERSION=3.32.2
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1001
      # To inspect UI via VNC: set VNC_PORT=5900, then connect a VNC viewer to localhost:5900
      - VNC_PORT=${VNC_PORT:-0}

    security_opt:
      - seccomp:unconfined

    network_mode: host

    profiles: [test]

  # arm64 runtime image (flutter-auto based, for AGL targets)
  # Prereq: output/adsw_monitor-release.tar.gz must already be built.
  # Build image: docker compose build adsw_monitor_arm64
  #   Or on an x86_64 host: docker buildx bake adsw_monitor_arm64
  adsw_monitor_arm64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64
      platforms:
        - linux/arm64
    image: adsw_monitor:arm64
    container_name: adsw_monitor_arm64

    volumes:
      # Mount the flutter-auto binary from the host
      - /usr/bin/flutter-auto:/usr/bin/flutter-auto:ro
      # GPU/DRM device access
      - /dev/dri:/dev/dri
      # Wayland socket mount (AGL default user UID=1001)
      - /run/user/1001:/run/user/1001
      # rosbridge URL override
      - ../adsw_monitor/config/config.json:/usr/share/flutter/adsw_monitor/3.32.2/release/data/flutter_assets/assets/config/config.json

    environment:
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1001
      - APP_NAME=adsw_monitor
      - APP_VERSION=3.32.2

    # host network for DDS/ROS2 communication
    network_mode: host

    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # ota_monitor — same pipeline as adsw_monitor, reused by changing only APP_NAME
  # (Dockerfiles take ARG APP_NAME.)
  # ═══════════════════════════════════════════════════════════════════════

  # ── Build services ──────────────────────────────────────────────────────

  # x86_64 Flutter Linux build (GTK bundle)
  # Run: docker compose --profile build run --rm ota_monitor_builder_x86
  ota_monitor_builder_x86:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build
    image: ota_monitor_builder:x86_64
    volumes:
      - ../ota_monitor:/workspace/app
      - ../output:/workspace/output
    profiles: [build]

  # arm64 AOT build (AGL Yocto SDK)
  # Run: docker compose --profile build run --rm ota_monitor_builder_arm64
  ota_monitor_builder_arm64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build.arm64
      args:
        AGL_SDK_USER: ${AGL_SDK_USER:-ossdev}
        AGL_SDK_PASSWORD: ${AGL_SDK_PASSWORD:-ossdev1234}
    image: ota_monitor_builder:arm64
    volumes:
      - ../ota_monitor:/workspace/app
      - ../output:/workspace/output
    profiles: [build]

  # ── Runtime services ────────────────────────────────────────────────────

  # x86_64 runtime image (GTK-based, for development/testing)
  ota_monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: ota_monitor
    image: ota_monitor:x86_64
    container_name: ota_monitor

    # Wayland socket mount (AGL/Linux environment)
    volumes:
      - /run/user/1000:/run/user/1000
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../ota_monitor/config/config.json:/app/config/config.json

    environment:
      - DISPLAY=:1
      - XDG_RUNTIME_DIR=/run/user/1000

    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

  # arm64 test image (QEMU emulation + headless Weston)
  # Prereq: output/ota_monitor-arm64-release.tar.gz + output/agl-binaries/
  ota_monitor_arm64_test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64.test
      args:
        APP_NAME: ota_monitor
        APP_VERSION: 3.32.2
      platforms:
        - linux/arm64
    image: ota_monitor:arm64-test
    container_name: ota_monitor_arm64_test

    volumes:
      - ../ota_monitor/config/config.json:/etc/ota_monitor/config.json

    environment:
      - APP_NAME=ota_monitor
      - APP_VERSION=3.32.2
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1001
      - VNC_PORT=${VNC_PORT:-0}

    security_opt:
      - seccomp:unconfined

    network_mode: host

    profiles: [test]

  # arm64 runtime image (flutter-auto based, for AGL targets)
  ota_monitor_arm64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arm64
      args:
        APP_NAME: ota_monitor
        APP_VERSION: 3.32.2
      platforms:
        - linux/arm64
    image: ota_monitor:arm64
    container_name: ota_monitor_arm64

    volumes:
      - /usr/bin/flutter-auto:/usr/bin/flutter-auto:ro
      - /dev/dri:/dev/dri
      - /run/user/1001:/run/user/1001
      - ../ota_monitor/config/config.json:/usr/share/flutter/ota_monitor/3.32.2/release/data/flutter_assets/assets/config/config.json

    environment:
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1001
      - APP_NAME=ota_monitor
      - APP_VERSION=3.32.2

    network_mode: host

    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # F013: OTA real-stack integration test infrastructure
  #
  # Two containers that let Flutter integration tests run against a real
  # rosbridge_server + rclpy OtaManager mock instead of the Dart MockOtaManager.
  #
  # Prereq:
  #   MMF_WS must point to the ROS2 workspace build output (the parent of
  #   install/setup.bash) that contains the mmf_interfaces package.
  #
  # Start:
  #   MMF_WS=/path/to/mmf_ws docker compose \
  #       --profile ota-real-stack up -d rosbridge ota_manager_mock
  #   docker compose --profile ota-real-stack logs -f ota_manager_mock
  #     # → "ota_manager_mock ready — 3 seeded apps"
  #
  # Run Flutter tests (separate shell):
  #   cd apps/ota_monitor
  #   DISPLAY=:99 flutter test integration_test/ota_integration_test.dart \
  #       -d linux --dart-define=OTA_ROS_URL=ws://localhost:9090
  #
  # Teardown:
  #   docker compose --profile ota-real-stack down
  # ═══════════════════════════════════════════════════════════════════════

  rosbridge:
    image: ros:humble-ros-base
    network_mode: host
    command: >
      bash -c "apt-get update &&
               apt-get install -y --no-install-recommends ros-humble-rosbridge-suite &&
               source /opt/ros/humble/setup.bash &&
               ros2 run rosbridge_server rosbridge_websocket"
    profiles: [ota-real-stack]
    restart: unless-stopped

  ota_manager_mock:
    image: ros:humble-ros-base
    network_mode: host
    volumes:
      - ../ota_monitor/integration_test:/mock:ro
      # Placeholder path when MMF_WS is not set — ota_manager_mock.py will
      # exit with a helpful import error.
      - ${MMF_WS:-./.placeholder-mmf-ws}/install:/mmf_install:ro
    command: >
      bash -c "apt-get update &&
               apt-get install -y --no-install-recommends python3 &&
               source /opt/ros/humble/setup.bash &&
               if [ -f /mmf_install/setup.bash ]; then
                 source /mmf_install/setup.bash;
               else
                 echo '[WARN] /mmf_install/setup.bash missing — set MMF_WS before starting compose (e.g. export MMF_WS=/path/to/ws)' >&2;
               fi &&
               python3 /mock/ota_manager_mock.py"
    depends_on: [rosbridge]
    profiles: [ota-real-stack]
    restart: unless-stopped
