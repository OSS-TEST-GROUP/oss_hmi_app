name: ✨ 기능 제안 · Feature Request
description: 새 기능이나 개선 사항을 제안합니다. / Suggest a new feature or improvement.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        제안 감사합니다. 아직 방향이 정해지지 않은 열린 토론은 Discussions Ideas 를 이용해 주세요.
        Thanks for the suggestion! For open-ended ideas that aren't fully formed yet, consider Discussions Ideas.

  - type: dropdown
    id: component
    attributes:
      label: 관련 앱 / 영역 · App / Component
      description: 제안이 관련된 앱이나 영역 / App or area this proposal relates to
      options:
        - adsw_monitor
        - diag_monitor
        - hmi_launcher
        - lfc_monitor
        - ota_monitor
        - oss_launcher_bot
        - vehicle_data_test
        - "공통·인프라 / Common·Infra"
        - "전반·기타 / General·Other"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 · Problem
      description: 어떤 불편이나 필요에서 출발했나요? / What problem or need motivates this request?
      placeholder: 지금은 ~ 때문에 ~ 하기 어렵습니다. / Today it's hard to ~ because ~.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용 · Proposal
      description: 원하는 동작이나 기능을 구체적으로 적어주세요. / Describe the desired behavior or feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 · Alternatives considered
      description: 다른 방법이나 우회책을 검토했다면 적어주세요. / Any alternatives or workarounds you considered.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 기여 · Contribution
      options:
        - label: 직접 구현하여 PR 을 제출할 의향이 있습니다. / I'm willing to implement this and submit a PR.
          required: false
